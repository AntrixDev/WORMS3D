<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WORMS3D</title>
    <style>
      * { 
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background-color: #000;
      }
      canvas#canvas {
        display: block;
        width: 100vw;
        height: 100vh;
       }
    </style>
  </head>
  <body>
    <div style="position: relative; display: inline-block;">
      <canvas id="canvas"></canvas>
      <div style="position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
